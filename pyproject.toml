[project]
name = "dram_sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "e1turin", email = "ivturnik2003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anywidget>=0.9",
    "marimo>=0.19",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "simpy>=4.1.2",
    "scipy>=1.18.0",
    "pandas>=3.0.3",
    "tqdm>=4.69.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter-console>=6.6.3",
    "notebook>=7.6.0",
]
